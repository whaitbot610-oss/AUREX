<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AUREX Lucky Wheel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0102;
            color: #ffffff;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 10px 15px 20px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* طبقة خلفية الصورة المباشرة */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://i.ibb.co/7xymDY18/file-000000000aec820a8bee37b8689ee9e4.png');
            background-position: center 10px; /* تم رفع محاذاة الصورة لضبط العرض */
            background-repeat: no-repeat;
            background-size: cover;
            z-index: -2;
        }

        /* توهج خلف العجلة */
        .ambient-light {
            position: absolute;
            top: 58%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, rgba(229, 9, 20, 0.4) 0%, rgba(212, 175, 55, 0.2) 60%, transparent 80%);
            z-index: -1;
            pointer-events: none;
            animation: ambientGlow 3s infinite alternate ease-in-out;
            border-radius: 50%;
        }

        @keyframes ambientGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.95; }
        }

        /* زيادة المسافة العلوية لتهبط العجلة وتظهر كلمة AUREX كاملة بالعلى دون أن يغطيها السهم */
        .header-spacer {
            width: 100%;
            height: 25vh; /* تم رفع المسافة من 18vh إلى 25vh */
            min-height: 120px;
        }

        /* حاوية العجلة المتركزة في المنتصف */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            z-index: 1;
        }

        /* إطار العجلة الخارجي */
        .wheel-outer-wrapper {
            position: relative;
            width: 325px;
            height: 325px;
            margin: 0 auto;
            border-radius: 50%;
            padding: 10px;
            background: radial-gradient(circle, #4a0105 0%, #170002 85%, #080001 100%);
            border: 3px solid rgba(212, 175, 55, 0.85);
            box-shadow: 0 0 35px rgba(229, 9, 20, 0.75), inset 0 0 25px rgba(0,0,0,0.95), 0 0 20px rgba(212, 175, 55, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* حلقة إنارة حديثة */
        .modern-lighting-ring {
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            pointer-events: none;
            background: linear-gradient(0deg, rgba(212,175,55,0.2), rgba(229,9,20,0.85), rgba(255,230,0,0.95), rgba(229,9,20,0.85));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 4px;
            animation: ringRotate 4s linear infinite;
            filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.8));
        }

        @keyframes ringRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .light-segments {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border-radius: 50%;
            pointer-events: none;
        }

        .light-node {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            margin: -3.5px;
            background: #fff7d6;
            box-shadow: 0 0 10px #ffe600, 0 0 18px #e50914;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .wheel-container {
            position: relative;
            width: 290px;
            height: 290px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.95);
        }

        #canvas {
            width: 290px;
            height: 290px;
            border-radius: 50%;
            display: block;
        }

        /* المؤشر/السهم */
        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 34px solid #ffe600;
            z-index: 10;
            filter: drop-shadow(0 5px 9px rgba(0,0,0,0.95));
        }

        .pointer::before {
            content: '';
            position: absolute;
            top: -36px;
            left: -10px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 24px solid #d4af37;
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -40px;
            left: -7px;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #ffffff 0%, #e50914 100%);
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 10px #e50914;
        }

        /* زر SPIN */
        .center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 68px;
            height: 68px;
            background: radial-gradient(circle at 35% 35%, #ff2a35 0%, #8b0005 70%, #3d0002 100%);
            border: 4px solid #f2d06b;
            border-radius: 50%;
            color: #ffffff;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 1px;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 0 20px rgba(0,0,0,0.95), inset 0 3px 6px rgba(255,255,255,0.6), inset 0 -4px 8px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        .center-btn:hover {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 0 28px rgba(212, 175, 55, 0.9), inset 0 3px 6px rgba(255,255,255,0.8);
        }

        .center-btn:active {
            transform: translate(-50%, -50%) scale(0.93);
        }

        .center-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            filter: grayscale(0.6);
        }

        /* كارت المعلومات */
        .info-card {
            background: rgba(18, 4, 7, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 20px;
            padding: 10px 20px;
            width: 100%;
            max-width: 320px;
            margin-top: 15px;
            display: flex;
            justify-content: space-around;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.85), inset 0 1px 2px rgba(255,255,255,0.15);
            z-index: 1;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-item span.label {
            font-size: 11px;
            color: #d1be9d;
            margin-bottom: 2px;
            font-weight: 700;
        }

        .info-item span.val {
            font-size: 17px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* نتائج الفوز/الخسارة */
        #result-modal {
            margin-top: 10px;
            font-size: 17px;
            font-weight: 900;
            min-height: 30px;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .win-msg {
            color: #2ecc71;
            text-shadow: 0 0 14px rgba(46, 204, 113, 0.9);
            animation: winBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite alternate;
        }

        .lose-msg {
            color: #ff4757;
            text-shadow: 0 0 12px rgba(255, 71, 87, 0.7);
        }

        @keyframes winBounce {
            from { transform: scale(0.95); }
            to { transform: scale(1.08); }
        }

        /* كانفاس تأثير العملات */
        #fxCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div class="ambient-light"></div>
    <canvas id="fxCanvas"></canvas>

    <div class="header-spacer"></div>

    <div class="main-container">
        <div class="wheel-outer-wrapper">
            <div class="modern-lighting-ring" id="lightingRing"></div>
            <div class="light-segments" id="lightSegments"></div>
            
            <div class="wheel-container">
                <div class="pointer"></div>
                <canvas id="canvas" width="290" height="290"></canvas>
                <button class="center-btn" id="spinBtn" onclick="startSpin()">SPIN</button>
            </div>
        </div>

        <div id="result-modal"></div>

        <div class="info-card">
            <div class="info-item">
                <span class="label">🎲 اللفات المتاحة</span>
                <span class="val" id="spinsCount">--</span>
            </div>
            <div class="info-item" style="width: 1px; background: rgba(212,175,55,0.3); margin: 2px 0;"></div>
            <div class="info-item">
                <span class="label">💎 رصيد البوت</span>
                <span class="val" id="userBal">--</span>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : null;
        if (!userId) {
            userId = urlParams.get("telegram_id") || urlParams.get("user_id");
        }
        if (userId === "null" || userId === "undefined") userId = null;

        const values = [0, 5, 10, 15, 25, 50, 100, 500, 10000];
        const numSlices = values.length;
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let currentAngle = 0;
        let isSpinning = false;

        // --- الإنارة الحديثة ---
        const lightSegments = document.getElementById("lightSegments");
        const totalNodes = 20;
        const nodeElements = [];

        function createModernLighting() {
            const radius = 154;
            const center = 162.5;
            for (let i = 0; i < totalNodes; i++) {
                const angle = (i * (2 * Math.PI / totalNodes));
                const x = center + radius * Math.cos(angle);
                const y = center + radius * Math.sin(angle);

                const node = document.createElement("div");
                node.className = "light-node";
                node.style.left = `${x}px`;
                node.style.top = `${y}px`;
                lightSegments.appendChild(node);
                nodeElements.push(node);
            }
        }
        createModernLighting();

        let lightStep = 0;
        let lightInterval = setInterval(animateLighting, 250);

        function animateLighting() {
            lightStep++;
            nodeElements.forEach((node, idx) => {
                const active = (idx + lightStep) % 3 === 0;
                if (isSpinning) {
                    node.style.background = active ? "#ffe600" : "#ff0033";
                    node.style.boxShadow = active ? "0 0 16px #ffe600, 0 0 25px #ffe600" : "0 0 8px #ff0033";
                    node.style.transform = active ? "scale(1.4)" : "scale(0.8)";
                } else {
                    node.style.background = active ? "#fff7d6" : "rgba(212, 175, 55, 0.3)";
                    node.style.boxShadow = active ? "0 0 10px #ffe600" : "none";
                    node.style.transform = active ? "scale(1.1)" : "scale(0.9)";
                }
            });
        }

        // --- رسم العجلة ---
        function drawWheel() {
            const radius = canvas.width / 2;
            const sliceAngle = (2 * Math.PI) / numSlices;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSlices; i++) {
                const angle = currentAngle + i * sliceAngle;
                
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, angle, angle + sliceAngle);
                ctx.closePath();

                if (i % 2 === 0) {
                    let grad = ctx.createRadialGradient(radius, radius, 10, radius, radius, radius);
                    grad.addColorStop(0, '#2a0205');
                    grad.addColorStop(1, '#0f0102');
                    ctx.fillStyle = grad;
                } else {
                    let grad = ctx.createRadialGradient(radius, radius, 10, radius, radius, radius);
                    grad.addColorStop(0, '#a80a12');
                    grad.addColorStop(1, '#5e0307');
                    ctx.fillStyle = grad;
                }
                ctx.fill();

                ctx.strokeStyle = "#d4af37";
                ctx.lineWidth = 1.8;
                ctx.stroke();

                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = "right";

                if (values[i] === 10000 || values[i] === 500) {
                    ctx.fillStyle = "#ffe600";
                    ctx.font = "900 13px Cairo, Arial";
                    ctx.shadowColor = "rgba(255, 230, 0, 0.9)";
                    ctx.shadowBlur = 10;
                } else {
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 12px Cairo, Arial";
                    ctx.shadowBlur = 0;
                }

                ctx.fillText(values[i] + " NSP", radius - 15, 4);
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(radius, radius, 36, 0, 2 * Math.PI);
            ctx.fillStyle = "#110203";
            ctx.fill();
            ctx.strokeStyle = "#d4af37";
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        // --- جلب بيانات المستخدم ---
        async function fetchUserData() {
            if (!userId) {
                document.getElementById("result-modal").innerText = "⚠️ افتح العجلة عبر البوت مباشرة.";
                return;
            }
            try {
                const res = await fetch('/api/get-spins?telegram_id=' + userId);
                const data = await res.json();
                if (data.status === 'success' || data.free_spins !== undefined) {
                    document.getElementById("spinsCount").innerText = data.free_spins || 0;
                    document.getElementById("userBal").innerText = (data.bot_balance || 0).toFixed(2) + " NSP";
                    document.getElementById("result-modal").innerText = "";
                }
            } catch (e) {
                document.getElementById("result-modal").innerText = "❌ تعذر الاتصال بالسيرفر";
            }
        }

        // --- عملية الدوران ---
        async function startSpin() {
            if (isSpinning || !userId) return;
            isSpinning = true;
            document.getElementById("spinBtn").disabled = true;
            document.getElementById("result-modal").innerText = "";

            clearInterval(lightInterval);
            lightInterval = setInterval(animateLighting, 70);
            document.getElementById("lightingRing").style.animationDuration = "1s";

            const payload = { telegram_id: userId, user_id: userId };
            for (const [key, val] of urlParams.entries()) {
                payload[key] = val;
            }

            try {
                const res = await fetch('/api/wheel/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.status !== 'success' && !data.prize_index && data.prize_index !== 0) {
                    document.getElementById("result-modal").innerHTML = `<span class="lose-msg">❌ ${data.error || "عذراً، حدث خطأ!"}</span>`;
                    isSpinning = false;
                    document.getElementById("spinBtn").disabled = false;
                    clearInterval(lightInterval);
                    lightInterval = setInterval(animateLighting, 250);
                    document.getElementById("lightingRing").style.animationDuration = "4s";
                    return;
                }

                const targetIndex = data.prize_index;
                const sliceAngle = (2 * Math.PI) / numSlices;
                
                const targetAngle = (1.5 * Math.PI) - (targetIndex * sliceAngle) - (sliceAngle / 2);
                const extraRounds = 7 * 2 * Math.PI;
                const startAngle = currentAngle;
                const normalizedCurrent = currentAngle % (2 * Math.PI);
                let diff = targetAngle - normalizedCurrent;
                if (diff < 0) diff += 2 * Math.PI;
                const finalAngle = startAngle + extraRounds + diff;

                let startTimestamp = null;
                const duration = 5000;

                function animate(timestamp) {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const elapsed = timestamp - startTimestamp;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 4);

                    currentAngle = startAngle + (finalAngle - startAngle) * easeOut;
                    drawWheel();

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        currentAngle = finalAngle;
                        drawWheel();
                        isSpinning = false;
                        document.getElementById("spinBtn").disabled = false;

                        clearInterval(lightInterval);
                        lightInterval = setInterval(animateLighting, 250);
                        document.getElementById("lightingRing").style.animationDuration = "4s";

                        document.getElementById("spinsCount").innerText = data.free_spins_left;
                        document.getElementById("userBal").innerText = (data.new_bot_balance || 0).toFixed(2) + " NSP";

                        if (data.reward > 0) {
                            document.getElementById("result-modal").innerHTML = `<span class="win-msg">🎉 مبروك! فزت بـ ${data.reward} NSP</span>`;
                            triggerGoldenLCoins();
                        } else {
                            document.getElementById("result-modal").innerHTML = `<span class="lose-msg">💔 حظ أوفر في المرة القادمة!</span>`;
                        }
                    }
                }
                requestAnimationFrame(animate);

            } catch (e) {
                isSpinning = false;
                document.getElementById("spinBtn").disabled = false;
                clearInterval(lightInterval);
                lightInterval = setInterval(animateLighting, 250);
                document.getElementById("lightingRing").style.animationDuration = "4s";
                document.getElementById("result-modal").innerText = "❌ خطأ في الشبكة";
            }
        }

        // --- تأثير تطاير عملات L السريع جداً (1 ثانية) ---
        const fxCanvas = document.getElementById("fxCanvas");
        const fxCtx = fxCanvas.getContext("2d");
        let coins = [];

        function resizeFxCanvas() {
            fxCanvas.width = window.innerWidth;
            fxCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeFxCanvas);
        resizeFxCanvas();

        function triggerGoldenLCoins() {
            coins = [];
            const count = 55;
            const startX = fxCanvas.width / 2;
            const startY = fxCanvas.height / 2;

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 24 + 14;
                coins.push({
                    x: startX,
                    y: startY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 7,
                    radius: Math.random() * 4 + 5,
                    rotationX: Math.random() * Math.PI,
                    rotSpeed: Math.random() * 0.5 + 0.3,
                    alpha: 1,
                    gravity: 0.85
                });
            }
            requestAnimationFrame(updateCoins);
        }

        function drawLCoins(c) {
            fxCtx.save();
            fxCtx.globalAlpha = Math.max(0, c.alpha);
            fxCtx.translate(c.x, c.y);
            
            const scaleX = Math.cos(c.rotationX);
            fxCtx.scale(scaleX, 1);

            fxCtx.beginPath();
            fxCtx.arc(0, 0, c.radius, 0, Math.PI * 2);
            let grad = fxCtx.createRadialGradient(0, 0, c.radius * 0.2, 0, 0, c.radius);
            grad.addColorStop(0, '#fff5b0');
            grad.addColorStop(0.5, '#ffd700');
            grad.addColorStop(1, '#b8860b');
            fxCtx.fillStyle = grad;
            fxCtx.fill();

            fxCtx.lineWidth = 1.5;
            fxCtx.strokeStyle = '#fff7d6';
            fxCtx.stroke();

            if (Math.abs(scaleX) > 0.2) {
                fxCtx.fillStyle = '#3d2400';
                fxCtx.font = `900 ${c.radius * 1.25}px Cairo, Arial`;
                fxCtx.textAlign = 'center';
                fxCtx.textBaseline = 'middle';
                fxCtx.fillText('L', 0, 0.5);
            }

            fxCtx.restore();
        }

        function updateCoins() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            let activeCount = 0;

            for (let i = 0; i < coins.length; i++) {
                let c = coins[i];
                c.x += c.vx;
                c.y += c.vy;
                c.vy += c.gravity;
                c.vx *= 0.92;
                c.rotationX += c.rotSpeed;
                c.alpha -= 0.035;

                if (c.alpha > 0) {
                    activeCount++;
                    drawLCoins(c);
                }
            }

            if (activeCount > 0) {
                requestAnimationFrame(updateCoins);
            }
        }

        drawWheel();
        fetchUserData();
    </script>
</body>
</html>
