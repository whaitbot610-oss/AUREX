<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lucky Wheel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #2c0306 0%, #0d0102 60%, #000000 100%);
            color: #ffffff;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            overflow: hidden;
            position: relative;
        }

        /* خلفية توهج ديناميكية متطورة */
        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(229, 9, 20, 0.35) 0%, rgba(212, 175, 55, 0.2) 50%, transparent 75%);
            z-index: 0;
            pointer-events: none;
            animation: ambientGlow 3s infinite alternate ease-in-out;
        }

        @keyframes ambientGlow {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
        }

        /* حاوية العجلة الخارجية مع الإطار الخارجي */
        .wheel-outer-wrapper {
            position: relative;
            width: 360px;
            height: 360px;
            margin: 15px auto;
            border-radius: 50%;
            padding: 16px;
            background: radial-gradient(circle, #6e0308 0%, #220002 100%);
            border: 5px solid #d4af37;
            box-shadow: 0 0 35px rgba(229, 9, 20, 0.7), inset 0 0 25px rgba(0,0,0,0.9), 0 0 20px rgba(212, 175, 55, 0.6);
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* حلقة مصابيح LED */
        .bulbs-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border-radius: 50%;
            pointer-events: none;
        }

        .bulb {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #fff;
            top: 50%;
            left: 50%;
            margin: -6px;
            transition: background 0.15s, box-shadow 0.15s;
        }

        .bulb.off {
            background-color: #2b2108;
            box-shadow: inset 0 0 3px #000;
        }

        .bulb.on-gold {
            background-color: #fff8bf;
            box-shadow: 0 0 12px #ffe600, 0 0 20px #ffcc00;
        }

        .bulb.on-red {
            background-color: #ff8585;
            box-shadow: 0 0 12px #ff0000, 0 0 20px #ff0000;
        }

        .wheel-container {
            position: relative;
            width: 310px;
            height: 310px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.95);
            /* إضافة الخلفية المطلوبة للعجلة */
            background-image: url('https://ibb.co/TDh3Gvgp');
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        #canvas {
            width: 310px;
            height: 310px;
            border-radius: 50%;
            display: block;
            position: relative;
            z-index: 2;
        }

        /* سهم المؤشر الفاخر */
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ffe600;
            z-index: 10;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.95));
        }

        .pointer::before {
            content: '';
            position: absolute;
            top: -42px;
            left: -14px;
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 30px solid #d4af37;
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -46px;
            left: -8px;
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #ffffff 0%, #e50914 100%);
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 12px #e50914;
        }

        /* زر الدوران المطور */
        .center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 76px;
            height: 76px;
            background: radial-gradient(circle at 30% 30%, #ff2a35 0%, #8b0005 70%, #4a0002 100%);
            border: 4px solid #f2d06b;
            border-radius: 50%;
            color: #ffffff;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 1px;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 0 25px rgba(0,0,0,0.9), inset 0 3px 6px rgba(255,255,255,0.6), inset 0 -4px 8px rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
        }

        .center-btn:hover {
            transform: translate(-50%, -50%) scale(1.06);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.9), inset 0 3px 6px rgba(255,255,255,0.7);
        }

        .center-btn:active {
            transform: translate(-50%, -50%) scale(0.92);
        }

        .center-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        /* كارت البيانات والمعلومات */
        .info-card {
            background: rgba(22, 6, 9, 0.82);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 22px;
            padding: 14px 22px;
            width: 100%;
            max-width: 340px;
            margin-top: 15px;
            display: flex;
            justify-content: space-around;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), inset 0 1px 2px rgba(255,255,255,0.15);
            z-index: 1;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-item span.label {
            font-size: 11px;
            color: #cbb48f;
            margin-bottom: 3px;
            font-weight: 700;
        }

        .info-item span.val {
            font-size: 19px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
        }

        /* نتائج الفوز والخسارة */
        #result-modal {
            margin-top: 15px;
            font-size: 18px;
            font-weight: 900;
            min-height: 32px;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .win-msg {
            color: #2ecc71;
            text-shadow: 0 0 15px rgba(46, 204, 113, 0.9);
            animation: winBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite alternate;
        }

        .lose-msg {
            color: #ff4757;
            text-shadow: 0 0 12px rgba(255, 71, 87, 0.7);
        }

        @keyframes winBounce {
            from { transform: scale(0.95); }
            to { transform: scale(1.1); }
        }

        /* كانفاس تطاير العملات الذهبية */
        #fxCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body>

    <canvas id="fxCanvas"></canvas>

    <!-- الإطار الخارجي للعجلة المزود بالمصابيح -->
    <div class="wheel-outer-wrapper">
        <div class="bulbs-container" id="bulbsContainer"></div>
        
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="canvas" width="310" height="310"></canvas>
            <button class="center-btn" id="spinBtn" onclick="startSpin()">SPIN</button>
        </div>
    </div>

    <div id="result-modal"></div>

    <div class="info-card">
        <div class="info-item">
            <span class="label">🎲 اللفات المتاحة</span>
            <span class="val" id="spinsCount">--</span>
        </div>
        <div class="info-item" style="width: 1px; background: rgba(212,175,55,0.3); margin: 2px 0;"></div>
        <div class="info-item">
            <span class="label">💎 رصيد البوت</span>
            <span class="val" id="userBal">--</span>
        </div>
    </div>

    <script>
        // --- محرك الصوتيات الواقعية الفاخرة (Web Audio API) ---
        class WheelSoundEngine {
            constructor() {
                this.audioCtx = null;
            }

            init() {
                if (!this.audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) this.audioCtx = new AudioContextClass();
                }
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
            }

            playTick() {
                if (!this.audioCtx) return;
                try {
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(750, this.audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(110, this.audioCtx.currentTime + 0.035);

                    gain.gain.setValueAtTime(0.4, this.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.035);

                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);

                    osc.start();
                    osc.stop(this.audioCtx.currentTime + 0.035);
                } catch (e) {}
            }

            playWinSound() {
                if (!this.audioCtx) return;
                try {
                    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                    notes.forEach((freq, idx) => {
                        const osc = this.audioCtx.createOscillator();
                        const gain = this.audioCtx.createGain();

                        osc.type = 'sine';
                        osc.frequency.value = freq;

                        const startTime = this.audioCtx.currentTime + idx * 0.07;
                        gain.gain.setValueAtTime(0.35, startTime);
                        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.45);

                        osc.connect(gain);
                        gain.connect(this.audioCtx.destination);

                        osc.start(startTime);
                        osc.stop(startTime + 0.45);
                    });
                } catch (e) {}
            }
        }

        const soundEngine = new WheelSoundEngine();

        // --- تهيئة التليجرام والمستخدم ---
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : null;
        if (!userId) {
            userId = urlParams.get("telegram_id") || urlParams.get("user_id");
        }
        if (userId === "null" || userId === "undefined") userId = null;

        // دعم استقبال أوامر التحكم بالخوارزمية عبر رابط الصفحة أو الاستجابة
        const forcedIndexParam = urlParams.get("forced_index");
        const algoSpeedParam = parseInt(urlParams.get("algo_speed")) || 5000;

        const values = [0, 5, 10, 15, 25, 50, 100, 500, 10000];
        const numSlices = values.length;
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let currentAngle = 0;
        let isSpinning = false;
        let lastTickSlice = -1;

        // --- إنشاء لمبات الإنارة حول العجلة ---
        const bulbsContainer = document.getElementById("bulbsContainer");
        const totalBulbs = 24;
        const bulbElements = [];

        function createBulbs() {
            const radius = 171;
            const center = 180;
            for (let i = 0; i < totalBulbs; i++) {
                const angle = (i * (2 * Math.PI / totalBulbs));
                const x = center + radius * Math.cos(angle);
                const y = center + radius * Math.sin(angle);

                const bulb = document.createElement("div");
                bulb.className = "bulb";
                bulb.style.left = `${x}px`;
                bulb.style.top = `${y}px`;
                bulbsContainer.appendChild(bulb);
                bulbElements.push(bulb);
            }
        }
        createBulbs();

        // تأثير وميض المصابيح المطور
        let bulbStep = 0;
        let bulbInterval = setInterval(animateBulbs, 350);

        function animateBulbs() {
            bulbStep++;
            bulbElements.forEach((bulb, idx) => {
                if (isSpinning) {
                    const active = (idx + bulbStep) % 2 === 0;
                    bulb.className = active ? "bulb on-gold" : "bulb on-red";
                } else {
                    if ((idx + bulbStep) % 2 === 0) {
                        bulb.className = "bulb on-gold";
                    } else {
                        bulb.className = "bulb off";
                    }
                }
            });
        }

        // --- رسم العجلة مع المحافظة على التصميم وإتاحة رؤية خلفيتها ---
        function drawWheel() {
            const radius = canvas.width / 2;
            const sliceAngle = (2 * Math.PI) / numSlices;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSlices; i++) {
                const angle = currentAngle + i * sliceAngle;
                
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, angle, angle + sliceAngle);
                ctx.closePath();

                // رسم شرائح متدرجة ونصف شفافة لإبراز الصورة والجمالية
                if (i % 2 === 0) {
                    let grad = ctx.createRadialGradient(radius, radius, 10, radius, radius, radius);
                    grad.addColorStop(0, 'rgba(42, 2, 5, 0.88)');
                    grad.addColorStop(1, 'rgba(15, 1, 2, 0.92)');
                    ctx.fillStyle = grad;
                } else {
                    let grad = ctx.createRadialGradient(radius, radius, 10, radius, radius, radius);
                    grad.addColorStop(0, 'rgba(168, 10, 18, 0.88)');
                    grad.addColorStop(1, 'rgba(94, 3, 7, 0.92)');
                    ctx.fillStyle = grad;
                }
                ctx.fill();

                // حدود الشريحة الذهبية
                ctx.strokeStyle = "rgba(212, 175, 55, 0.85)";
                ctx.lineWidth = 1.8;
                ctx.stroke();

                // رسم النصوص
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = "right";

                if (values[i] === 10000 || values[i] === 500) {
                    ctx.fillStyle = "#ffe600";
                    ctx.font = "900 14px Cairo, Arial";
                    ctx.shadowColor = "rgba(255, 230, 0, 0.9)";
                    ctx.shadowBlur = 10;
                } else {
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 13px Cairo, Arial";
                    ctx.shadowBlur = 0;
                }

                ctx.fillText(values[i] + " NSP", radius - 20, 5);
                ctx.restore();
            }

            // إطار العجلة الداخلي
            ctx.beginPath();
            ctx.arc(radius, radius, 42, 0, 2 * Math.PI);
            ctx.fillStyle = "#110203";
            ctx.fill();
            ctx.strokeStyle = "#d4af37";
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        // --- جلب بيانات المستخدم المربوط بالخلفية ---
        async function fetchUserData() {
            if (!userId) {
                document.getElementById("result-modal").innerText = "⚠️ افتح العجلة عبر البوت مباشرة.";
                return;
            }
            try {
                const res = await fetch('/api/get-spins?telegram_id=' + userId);
                const data = await res.json();
                if (data.status === 'success' || data.free_spins !== undefined) {
                    document.getElementById("spinsCount").innerText = data.free_spins || 0;
                    document.getElementById("userBal").innerText = (data.bot_balance || 0).toFixed(2) + " NSP";
                    document.getElementById("result-modal").innerText = "";
                }
            } catch (e) {
                document.getElementById("result-modal").innerText = "❌ تعذر الاتصال بالسيرفر";
            }
        }

        // --- عملية الدوران والتحكم الخوارزمي ---
        async function startSpin() {
            if (isSpinning || !userId) return;
            soundEngine.init();

            isSpinning = true;
            document.getElementById("spinBtn").disabled = true;
            document.getElementById("result-modal").innerText = "";

            // تسريع وميض اللمبات
            clearInterval(bulbInterval);
            bulbInterval = setInterval(animateBulbs, 80);

            try {
                const res = await fetch('/api/wheel/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: userId, user_id: userId })
                });
                const data = await res.json();

                if (data.status !== 'success' && data.prize_index === undefined) {
                    document.getElementById("result-modal").innerHTML = `<span class="lose-msg">❌ ${data.error || "عذراً، حدث خطأ!"}</span>`;
                    isSpinning = false;
                    document.getElementById("spinBtn").disabled = false;
                    clearInterval(bulbInterval);
                    bulbInterval = setInterval(animateBulbs, 350);
                    return;
                }

                // استقبال الخوارزمية وتحديد النتيجة المستهدفة
                let targetIndex = data.prize_index;
                if (data.forced_index !== undefined) targetIndex = data.forced_index;
                if (forcedIndexParam !== null) targetIndex = parseInt(forcedIndexParam);

                const sliceAngle = (2 * Math.PI) / numSlices;
                const targetAngle = (1.5 * Math.PI) - (targetIndex * sliceAngle) - (sliceAngle / 2);
                const extraRounds = 8 * 2 * Math.PI;
                const startAngle = currentAngle;
                const normalizedCurrent = currentAngle % (2 * Math.PI);
                let diff = targetAngle - normalizedCurrent;
                if (diff < 0) diff += 2 * Math.PI;
                const finalAngle = startAngle + extraRounds + diff;

                let startTimestamp = null;
                const duration = algoSpeedParam;

                function animate(timestamp) {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const elapsed = timestamp - startTimestamp;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 4);

                    currentAngle = startAngle + (finalAngle - startAngle) * easeOut;
                    drawWheel();

                    // حساسية الصوت الميكانيكي لحركة الأقسام أسفل السهم
                    const currentSliceIndex = Math.floor((((1.5 * Math.PI - currentAngle) % (2 * Math.PI) + (2 * Math.PI)) % (2 * Math.PI)) / sliceAngle);
                    if (currentSliceIndex !== lastTickSlice) {
                        soundEngine.playTick();
                        lastTickSlice = currentSliceIndex;
                    }

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        currentAngle = finalAngle;
                        drawWheel();
                        isSpinning = false;
                        document.getElementById("spinBtn").disabled = false;

                        clearInterval(bulbInterval);
                        bulbInterval = setInterval(animateBulbs, 350);

                        document.getElementById("spinsCount").innerText = data.free_spins_left !== undefined ? data.free_spins_left : data.free_spins;
                        document.getElementById("userBal").innerText = (data.new_bot_balance !== undefined ? data.new_bot_balance : (data.bot_balance || 0)).toFixed(2) + " NSP";

                        if (data.reward > 0) {
                            document.getElementById("result-modal").innerHTML = `<span class="win-msg">🎉 مبروك! فزت بـ ${data.reward} NSP</span>`;
                            soundEngine.playWinSound();
                            triggerGoldCoins(); // إطلاق العملات الذهبية السريعة والضخمة
                        } else {
                            document.getElementById("result-modal").innerHTML = `<span class="lose-msg">💔 حظ أوفر في المرة القادمة!</span>`;
                        }
                    }
                }
                requestAnimationFrame(animate);

            } catch (e) {
                isSpinning = false;
                document.getElementById("spinBtn").disabled = false;
                clearInterval(bulbInterval);
                bulbInterval = setInterval(animateBulbs, 350);
                document.getElementById("result-modal").innerText = "❌ خطأ في الشبكة";
            }
        }

        // --- تأثير تطاير العملات الذهبية الكبيرة والسلسة السريعة ---
        const fxCanvas = document.getElementById("fxCanvas");
        const fxCtx = fxCanvas.getContext("2d");
        let coins = [];

        function resizeFxCanvas() {
            fxCanvas.width = window.innerWidth;
            fxCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeFxCanvas);
        resizeFxCanvas();

        function triggerGoldCoins() {
            coins = [];
            const coinCount = 50;
            for (let i = 0; i < coinCount; i++) {
                coins.push({
                    x: fxCanvas.width / 2,
                    y: fxCanvas.height / 2 + 50,
                    vx: (Math.random() - 0.5) * 22,
                    vy: (Math.random() - 0.8) * 24,
                    size: Math.random() * 16 + 22, // حجم كبير للعملة الذهبية
                    gravity: 0.65,
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 18,
                    scaleY: 1,
                    vScale: Math.random() * 0.1 + 0.05,
                    alpha: 1
                });
            }
            requestAnimationFrame(updateGoldCoins);
        }

        function updateGoldCoins() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            let alive = false;

            coins.forEach(c => {
                c.x += c.vx;
                c.y += c.vy;
                c.vy += c.gravity;
                c.rotation += c.vRot;
                c.scaleY += c.vScale;
                if (Math.abs(c.scaleY) > 1) c.vScale = -c.vScale;
                c.alpha -= 0.012;

                if (c.alpha > 0) {
                    alive = true;
                    fxCtx.save();
                    fxCtx.globalAlpha = Math.max(0, c.alpha);
                    fxCtx.translate(c.x, c.y);
                    fxCtx.rotate(c.rotation * Math.PI / 180);
                    fxCtx.scale(1, c.scaleY);

                    // رسم عملة ذهبية فاخرة بالكامل بلمعان ثلاثي الأبعاد
                    fxCtx.beginPath();
                    fxCtx.arc(0, 0, c.size, 0, 2 * Math.PI);
                    let goldGrad = fxCtx.createRadialGradient(-c.size*0.3, -c.size*0.3, 2, 0, 0, c.size);
                    goldGrad.addColorStop(0, '#ffffff');
                    goldGrad.addColorStop(0.3, '#ffe600');
                    goldGrad.addColorStop(0.8, '#d4af37');
                    goldGrad.addColorStop(1, '#996515');
                    fxCtx.fillStyle = goldGrad;
                    fxCtx.fill();

                    fxCtx.strokeStyle = '#fff5a3';
                    fxCtx.lineWidth = 2.5;
                    fxCtx.stroke();

                    // نقش داخلي للعملة الذهبية
                    fxCtx.beginPath();
                    fxCtx.arc(0, 0, c.size * 0.7, 0, 2 * Math.PI);
                    fxCtx.strokeStyle = 'rgba(153, 101, 21, 0.6)';
                    fxCtx.lineWidth = 1.5;
                    fxCtx.stroke();

                    fxCtx.fillStyle = '#7a5200';
                    fxCtx.font = `900 ${c.size * 0.8}px Cairo, Arial`;
                    fxCtx.textAlign = 'center';
                    fxCtx.textBaseline = 'middle';
                    fxCtx.fillText('$', 0, 1);

                    fxCtx.restore();
                }
            });

            if (alive) requestAnimationFrame(updateGoldCoins);
        }

        // تشغيل البداية
        drawWheel();
        fetchUserData();
    </script>
</body>
</html>
