<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AUREX Slots 🎰</title>
    <style>
        :root {
            --bg-color: #0a080c;
            --card-bg: #121620;
            --gold: #f59e0b;
            --gold-bright: #ffd700;
            --border-gold: #bf953f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
        body { background: var(--bg-color); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 15px; }

        /* Top Header */
        .header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border-gold); }
        .title { font-size: 1.1rem; font-weight: bold; color: var(--gold-bright); }
        .balance-box { background: #000; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--gold); font-size: 0.9rem; font-weight: bold; }
        .balance-box span { color: var(--gold-bright); }

        /* Slot Machine Body */
        .slot-machine { width: 100%; max-width: 360px; background: linear-gradient(145deg, #181d2a, #0d1017); border: 2px solid var(--border-gold); border-radius: 20px; padding: 20px; box-shadow: 0 0 25px rgba(245, 158, 11, 0.25); margin: 20px 0; }
        .reels-container { display: flex; justify-content: space-between; background: #000; border: 2px solid var(--border-gold); border-radius: 12px; padding: 10px; gap: 8px; overflow: hidden; position: relative; }
        
        .reel { flex: 1; height: 120px; background: #121620; border-radius: 8px; border: 1px solid #2d3748; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; transition: transform 0.1s ease; }
        .win-line { position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: rgba(255, 215, 0, 0.6); pointer-events: none; transform: translateY(-50%); box-shadow: 0 0 8px #ffd700; }

        /* Controls */
        .controls { width: 100%; max-width: 360px; background: var(--card-bg); padding: 15px; border-radius: 16px; border: 1px solid var(--border-gold); display: flex; flex-direction: column; gap: 12px; }
        .bet-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .btn-bet { background: rgba(255, 255, 255, 0.05); border: 1px solid #3b2a1a; color: #fff; padding: 8px 0; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-bet.active { background: var(--gold); color: #000; border-color: var(--gold-bright); }

        .spin-btn { background: linear-gradient(135deg, #bf953f, #aa771c); color: #000; border: none; padding: 14px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; }
        .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Toast Result */
        .toast { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: rgba(18, 22, 32, 0.95); border: 2px solid var(--gold-bright); padding: 20px 30px; border-radius: 16px; text-align: center; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 10; }
        .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">🎰 AUREX SLOTS</div>
        <div class="balance-box">الرصيد: <span id="balance">1000.00</span> NSP</div>
    </div>

    <div class="slot-machine">
        <div class="reels-container">
            <div class="win-line"></div>
            <div class="reel" id="reel1">7️⃣</div>
            <div class="reel" id="reel2">💎</div>
            <div class="reel" id="reel3">🔔</div>
        </div>
    </div>

    <div class="controls">
        <div style="font-size:0.85rem; color:#aaa; text-align:center;">اختر الرهان:</div>
        <div class="bet-buttons">
            <button class="btn-bet active" onclick="setBet(10, this)">10</button>
            <button class="btn-bet" onclick="setBet(50, this)">50</button>
            <button class="btn-bet" onclick="setBet(100, this)">100</button>
            <button class="btn-bet" onclick="setBet(500, this)">500</button>
        </div>
        <button id="spinBtn" class="spin-btn" onclick="spin()">سحب الذراع 🚀</button>
    </div>

    <div id="toast" class="toast">
        <h3 id="toastTitle" style="color:var(--gold-bright);"></h3>
        <p id="toastDesc"></p>
    </div>

    <script>
        const symbols = ['7️⃣', '💎', '🔔', '👑', '🍒', '🍋'];
        let balance = 1000.0;
        let currentBet = 10;
        let isSpinning = false;

        function setBet(amount, btn) {
            if (isSpinning) return;
            currentBet = amount;
            document.querySelectorAll('.btn-bet').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function spin() {
            if (isSpinning) return;
            if (balance < currentBet) { alert("رصيدك غير كافٍ!"); return; }

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            balance -= currentBet;
            document.getElementById('balance').innerText = balance.toFixed(2);

            const reelElements = [document.getElementById('reel1'), document.getElementById('reel2'), document.getElementById('reel3')];
            let results = [];

            // انيميشن الدوران
            let interval = setInterval(() => {
                reelElements.forEach(r => r.innerText = symbols[Math.floor(Math.random() * symbols.length)]);
            }, 80);

            setTimeout(() => {
                clearInterval(interval);
                // تحديد النتائج النهائية
                results = [
                    symbols[Math.floor(Math.random() * symbols.length)],
                    symbols[Math.floor(Math.random() * symbols.length)],
                    symbols[Math.floor(Math.random() * symbols.length)]
                ];

                reelElements.forEach((r, idx) => r.innerText = results[idx]);
                checkWin(results);
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
            }, 2000);
        }

        function checkWin(res) {
            let winAmount = 0;
            if (res[0] === res[1] && res[1] === res[2]) {
                winAmount = res[0] === '7️⃣' ? currentBet * 10 : currentBet * 5;
            } else if (res[0] === res[1] || res[1] === res[2] || res[0] === res[2]) {
                winAmount = currentBet * 1.5;
            }

            const toast = document.getElementById('toast');
            if (winAmount > 0) {
                balance += winAmount;
                document.getElementById('toastTitle').innerText = "فوز رائع! 🎉";
                document.getElementById('toastDesc').innerText = `ربحت ${winAmount.toFixed(2)} NSP`;
            } else {
                document.getElementById('toastTitle').innerText = "حظ أوفر 💔";
                document.getElementById('toastDesc').innerText = "حاول مرة أخرى";
            }
            document.getElementById('balance').innerText = balance.toFixed(2);
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);

            window.parent.postMessage({ action: 'UPDATE_BALANCE' }, '*');
        }
    </script>
</body>
</html>
