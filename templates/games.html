<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الألعاب ★ AUREX CASINO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --accent-gold: #f59e0b;
            --gold-bright: #ffd700;
            --bg-card: rgba(18, 22, 32, 0.92);
            --bg-main: #0a080c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
        body { background: var(--bg-main); color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Top Bar */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: rgba(10, 8, 12, 0.95);
            border-bottom: 2px solid #b38728; position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(8px);
        }
        .back-btn { color: var(--accent-gold); text-decoration: none; font-weight: bold; font-size: 0.85rem; border: 1px solid #bf953f; padding: 5px 12px; border-radius: 8px; background: rgba(0,0,0,0.5); }
        .balance-box { background: rgba(15, 10, 5, 0.9); border: 1px solid #d4af37; border-radius: 12px; padding: 4px 10px; font-weight: bold; font-size: 0.85rem; }
        .balance-box span { color: var(--gold-bright); }

        /* Content & Grid */
        .games-container { padding: 20px; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; }
        .section-title { font-size: 1.2rem; color: var(--accent-gold); margin-bottom: 15px; border-bottom: 1px solid #3b2a1a; padding-bottom: 8px; text-align: center; }

        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .game-card {
            background: #121620; border: 1px solid #bf953f; border-radius: 12px;
            overflow: hidden; text-align: center; transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .game-card:hover { transform: translateY(-4px); box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
        .game-thumb { width: 100%; height: 120px; object-fit: cover; background: #1a202c; }
        .game-info { padding: 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
        .game-title { font-size: 0.85rem; font-weight: bold; color: #fff; }
        .play-btn {
            background: linear-gradient(135deg, #bf953f, #aa771c); color: #000;
            border: none; border-radius: 6px; padding: 8px; font-weight: bold;
            cursor: pointer; font-size: 0.85rem; width: 100%; transition: opacity 0.2s;
        }
        .play-btn:hover { opacity: 0.9; }

        /* Fullscreen Game Frame */
        .game-modal {
            display: none; position: fixed; inset: 0; background: #000; z-index: 999;
            flex-direction: column;
        }
        .modal-top {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: #11141c; border-bottom: 1px solid #bf953f;
        }
        .close-game-btn { background: #dc2626; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .game-iframe { width: 100%; height: 100%; border: none; flex: 1; }
    </style>
</head>
<body>
    <header class="top-bar">
        <a href="/" class="back-btn">⬅️ الرئيسية</a>
        <div class="balance-box">
            رصيد الموقع: <span id="siteBalance">0.00</span> NSP
        </div>
    </header>

    <main class="games-container">
        <h2 class="section-title">🎮 قائمة الألعاب المتاحة</h2>
        <div class="games-grid" id="gamesGrid">
            <!-- يتم تحميل الألعاب تلقائياً من المجلدات المستقلة -->
        </div>
    </main>

    <!-- نافذة تشغيل اللعبة -->
    <div class="game-modal" id="gameModal">
        <div class="modal-top">
            <span style="color:var(--accent-gold); font-weight:bold;" id="activeGameTitle">جاري اللعب...</span>
            <button class="close-game-btn" onclick="closeGame()">✕ إغلاق اللعبة</button>
        </div>
        <iframe id="gameIframe" class="game-iframe" src=""></iframe>
    </div>

    <script>
        let currentUserBalance = 0.0;

        // 1. جلب رصيد المستخدم تلقائياً
        async function fetchUserAccount() {
            try {
                const res = await fetch('/api/user/account');
                if (res.ok) {
                    const user = await res.json();
                    currentUserBalance = parseFloat(user.site_balance || 0);
                    document.getElementById('siteBalance').innerText = currentUserBalance.toFixed(2);
                }
            } catch(e) { console.error(e); }
        }

        // 2. جلب الألعاب المضافة تلقائياً دون التعديل على أي ملف
        async function loadGames() {
            const grid = document.getElementById('gamesGrid');
            try {
                const res = await fetch('/api/games/list');
                const data = await res.json();
                
                if (data.status === 'success' && data.games.length > 0) {
                    grid.innerHTML = '';
                    data.games.forEach(game => {
                        const thumbUrl = `/games/${game.folder}/cover.png`;
                        grid.innerHTML += `
                            <div class="game-card">
                                <img src="${thumbUrl}" class="game-thumb" onerror="this.src='https://via.placeholder.com/150x120/121620/bf953f?text=AUREX'">
                                <div class="game-info">
                                    <div class="game-title">${game.name}</div>
                                    <button class="play-btn" onclick="playGame('${game.name}', '${game.url}')">العب الآن 🎰</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#aaa;">لا توجد ألعاب مضافة حالياً.</p>';
                }
            } catch(e) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#f43f5e;">حدث خطأ أثناء جلب قائمة الألعاب.</p>';
            }
        }

        // 3. فتح اللعبة والدخول إليها
        function playGame(name, url) {
            document.getElementById('activeGameTitle').innerText = name;
            document.getElementById('gameIframe').src = url;
            document.getElementById('gameModal').style.display = 'flex';
        }

        // 4. إغلاق اللعبة وتحديث الرصيد فوراً
        function closeGame() {
            document.getElementById('gameIframe').src = '';
            document.getElementById('gameModal').style.display = 'none';
            fetchUserAccount();
        }

        // تحديث الرصيد عند استقبال إشعار من اللعبة
        window.addEventListener('message', (event) => {
            if (event.data && event.data.action === 'UPDATE_BALANCE') {
                fetchUserAccount();
            }
        });

        fetchUserAccount();
        loadGames();
    </script>
</body>
</html>
