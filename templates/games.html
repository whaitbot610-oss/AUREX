<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صالة الألعاب</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --accent-gold: #f59e0b;
            --accent-gold-bright: #ffd700;
            --bg-card: rgba(18, 22, 32, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            user-select: none; 
        }
        
        body { 
            background: #0a080c url('https://i.ibb.co/v6DT6MVH/file-00000000149c82468460bc807f362071.png') no-repeat top center; 
            background-size: 100% auto; 
            background-attachment: fixed;
            color: var(--text-main); 
            min-height: 100vh; 
            padding-bottom: 40px; 
            overflow-y: auto;
        }
        
        .top-bar {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 12px 16px; 
            background: rgba(10, 8, 12, 0.75);
            border-bottom: 1px solid rgba(212, 175, 55, 0.4); 
            position: sticky; 
            top: 0; 
            z-index: 100;
            backdrop-filter: blur(8px);
        }
        
        .btn-back { 
            background: rgba(26, 32, 44, 0.8); 
            color: var(--accent-gold); 
            border: 1px solid #b38728; 
            padding: 6px 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-back:active { transform: scale(0.95); }

        .balance-box { 
            background: rgba(15, 10, 5, 0.85); 
            border: 1px solid #d4af37; 
            padding: 6px 12px; 
            border-radius: 12px; 
            font-weight: bold; 
            color: #fff; 
            font-size: 0.85rem; 
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .container { 
            padding: 16px; 
            max-width: 800px; 
            margin: 0 auto; 
        }

        /* تصميم فاخر لعنوان الألعاب */
        .section-title { 
            font-size: 1.4rem; 
            font-weight: 900; 
            text-align: center; 
            margin: 20px 0 25px 0; 
            background: linear-gradient(135deg, #ffe082 0%, #d4af37 50%, #aa771c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 15px rgba(212, 175, 55, 0.4);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            background: rgba(18, 22, 32, 0.6);
            border: 1px dashed rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            margin-top: 10px;
            backdrop-filter: blur(5px);
        }
        .empty-state-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .empty-state-text { color: var(--text-muted); font-size: 0.95rem; }

        .games-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 14px; 
        }

        .game-card {
            background: var(--bg-card); 
            border: 1px solid rgba(212, 175, 55, 0.3); 
            border-radius: 12px;
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            transition: transform 0.2s, border-color 0.2s; 
            backdrop-filter: blur(4px);
        }
        .game-card:hover { 
            transform: translateY(-3px); 
            border-color: var(--accent-gold); 
        }
        .game-img { 
            width: 100%; 
            height: 110px; 
            object-fit: cover; 
            background: #1a202c; 
        }
        .game-info { 
            padding: 10px; 
            width: 100%; 
            text-align: center; 
        }
        .game-title { 
            font-size: 0.85rem; 
            font-weight: bold; 
            color: #fff; 
            margin-bottom: 8px; 
        }
        .btn-play {
            background: linear-gradient(135deg, #bf953f, #aa771c); 
            color: #000;
            border: none; 
            padding: 6px 0; 
            width: 100%; 
            border-radius: 6px;
            font-weight: bold; 
            font-size: 0.8rem; 
            cursor: pointer; 
            text-decoration: none; 
            display: block;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <button class="btn-back" onclick="window.location.href='/'">❮ العودة للموقع</button>
        <div class="balance-box">🌐 الرصيد: <span id="siteBalance">0.00</span> NSP</div>
    </header>

    <div class="container">
        <div class="section-title">
            <span>✨</span> الألعاب المتاحة <span>✨</span>
        </div>

        <div class="games-grid" id="gamesGrid">
            <!-- يظهر هذا العنصر تلقائياً عند عدم وجود ألعاب -->
            <div class="empty-state">
                <div class="empty-state-icon">🎰</div>
                <div class="empty-state-text">لا توجد ألعاب مضافة حالياً<br><small style="opacity: 0.7;">سيتم إضافة الألعاب قريباً</small></div>
            </div>
        </div>
    </div>

    <script>
        async function loadAccount() {
            try {
                const res = await fetch('/api/user/account');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('siteBalance').innerText = parseFloat(data.site_balance || 0).toFixed(2);
                }
            } catch (e) {}
        }

        async function loadGames() {
            const grid = document.getElementById('gamesGrid');
            try {
                const res = await fetch('/api/games/list');
                const data = await res.json();
                
                // تصفية وحذف الألعاب الافتراضية القديمة تلقائياً
                const filteredGames = (data.games || []).filter(g => 
                    g.name !== "فواكة بالكيلو" && 
                    g.name !== "AUREX Slots" &&
                    !g.folder?.includes("slots")
                );

                if (filteredGames.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🎰</div>
                            <div class="empty-state-text">لا توجد ألعاب مضافة حالياً<br><small style="opacity: 0.7;">سيتم إضافة الألعاب قريباً</small></div>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = '';
                for (const game of filteredGames) {
                    let title = game.name;
                    let imgUrl = `/games/${game.folder}/cover.png`;

                    try {
                        const infoRes = await fetch(`/games/${game.folder}/info.json`);
                        if (infoRes.ok) {
                            const info = await infoRes.json();
                            if (info.title) title = info.title;
                            if (info.image) imgUrl = `/games/${game.folder}/${info.image}`;
                        }
                    } catch (e) {}

                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <img src="${imgUrl}" class="game-img" onerror="this.src='https://via.placeholder.com/150x120?text=GAME'">
                        <div class="game-info">
                            <div class="game-title">${title}</div>
                            <a href="${game.url}" class="btn-play">العب الآن 🎮</a>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            } catch (e) {
                // في حالة عدم الاتصال بالخادم يظل الإشعار بالنظافة ظاهراً
            }
        }

        loadAccount();
        loadGames();
    </script>
</body>
</html>
