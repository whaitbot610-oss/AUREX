<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الألعاب - AUREX CASINO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --accent-gold: #f59e0b;
            --accent-gold-bright: #ffd700;
            --bg-card: rgba(18, 22, 32, 0.95);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-gold: #d4af37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background: #0a080c url('https://i.ibb.co/V0ymNqTp/IMG.png') no-repeat top center;
            background-size: 100% auto;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: rgba(10, 8, 12, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid var(--border-gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            background: linear-gradient(135deg, #bf953f, #aa771c);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .balance-box {
            background: rgba(15, 10, 5, 0.9);
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            padding: 4px 10px;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .balance-box .tag {
            background: #bf953f;
            color: #000;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 900;
        }

        /* Games Container */
        .container {
            flex: 1;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .page-title {
            text-align: center;
            color: var(--accent-gold-bright);
            margin-bottom: 20px;
            font-size: 1.4rem;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.4);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
        }

        .game-card {
            background: var(--bg-card);
            border: 1.5px solid var(--border-gold);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.3);
        }

        .game-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            background: #1a202c;
        }

        .game-info {
            padding: 10px;
            text-align: center;
            width: 100%;
        }

        .game-name {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .play-btn {
            display: block;
            width: 100%;
            padding: 8px 0;
            background: linear-gradient(135deg, #bf953f, #aa771c);
            color: #000;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            border-radius: 6px;
            text-align: center;
        }

        .empty-msg {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-muted);
            padding: 40px 0;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <a href="/" class="back-btn">⬅ العودة للموقع</a>
        <div class="balance-box">
            <span class="tag">NSP</span>
            <span id="siteBalance">0.00</span>
        </div>
    </header>

    <main class="container">
        <h2 class="page-title">🎰 صالة الألعاب المتاحة</h2>
        <div class="games-grid" id="gamesGrid">
            <div class="empty-msg">جاري تحميل قائمة الألعاب...</div>
        </div>
    </main>

    <script>
        // 1. جلب رصيد حساب المستخدم
        async function loadUserBalance() {
            try {
                const res = await fetch('/api/user/account');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('siteBalance').innerText = parseFloat(data.site_balance || 0).toFixed(2);
                }
            } catch (e) {
                console.error("خطأ في جلب الرصيد:", e);
            }
        }

        // 2. قراءة الألعاب المضافة تلقائياً من مجلد الألعاب عبر API السيرفر
        async function loadGamesList() {
            const grid = document.getElementById('gamesGrid');
            try {
                const res = await fetch('/api/games/list');
                const data = await res.json();

                if (data.status === 'success' && data.games && data.games.length > 0) {
                    grid.innerHTML = '';
                    data.games.forEach(game => {
                        // مسار صورة غلاف اللعبة التلقائي داخل مجلد اللعبة
                        const coverImg = `/games/${game.folder}/cover.png`;
                        // صورة احتياطية في حال عدم وجود صورة اللعبة
                        const fallbackImg = 'https://i.ibb.co/V0ymNqTp/IMG.png';

                        grid.innerHTML += `
                            <div class="game-card">
                                <img src="${coverImg}" class="game-img" onerror="this.onerror=null;this.src='${fallbackImg}';" alt="${game.name}">
                                <div class="game-info">
                                    <div class="game-name">${game.name}</div>
                                    <a href="${game.url}" class="play-btn">العب الآن 🎮</a>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    grid.innerHTML = '<div class="empty-msg">لا توجد ألعاب مضافة حالياً.</div>';
                }
            } catch (e) {
                grid.innerHTML = '<div class="empty-msg">حدث خطأ أثناء تحميل الألعاب.</div>';
            }
        }

        loadUserBalance();
        loadGamesList();
    </script>
</body>
</html>
