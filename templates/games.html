<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صالة الألعاب ★ AUREX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --accent-gold: #f59e0b;
            --accent-gold-bright: #ffd700;
            --bg-card: rgba(18, 22, 32, 0.92);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
        body { background: #0a080c; color: var(--text-main); min-height: 100vh; padding-bottom: 30px; }
        
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: rgba(10, 8, 12, 0.95);
            border-bottom: 2px solid #b38728; sticky; top: 0; z-index: 100;
        }
        .btn-back { background: #1a202c; color: var(--accent-gold); border: 1px solid #b38728; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .balance-box { background: rgba(15, 10, 5, 0.9); border: 1px solid #d4af37; padding: 6px 12px; border-radius: 12px; font-weight: bold; color: #fff; font-size: 0.85rem; }

        .container { padding: 16px; max-width: 800px; margin: 0 auto; }
        .section-title { font-size: 1.2rem; color: var(--accent-gold); margin-bottom: 16px; text-align: center; font-weight: bold; }

        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
        .game-card {
            background: var(--bg-card); border: 1px solid #3b2a1a; border-radius: 12px;
            overflow: hidden; display: flex; flex-direction: column; align-items: center;
            transition: transform 0.2s, border-color 0.2s; position: relative;
        }
        .game-card:hover { transform: translateY(-3px); border-color: var(--accent-gold); }
        .game-img { width: 100%; height: 120px; object-fit: cover; background: #1a202c; }
        .game-info { padding: 10px; width: 100%; text-align: center; }
        .game-title { font-size: 0.9rem; font-weight: bold; color: #fff; margin-bottom: 8px; }
        .btn-play {
            background: linear-gradient(135deg, #bf953f, #aa771c); color: #000;
            border: none; padding: 6px 0; width: 100%; border-radius: 6px;
            font-weight: bold; font-size: 0.8rem; cursor: pointer; text-decoration: none; display: block;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <button class="btn-back" onclick="window.location.href='/'">❮ العودة للموقع</button>
        <div class="balance-box">🌐 الرصيد: <span id="siteBalance">0.00</span> NSP</div>
    </header>

    <div class="container">
        <div class="section-title">🎰 الألعاب المتاحة</div>
        <div class="games-grid" id="gamesGrid">
            <p style="text-align:center; grid-column: 1/-1; color: var(--text-muted);">جاري تحميل الألعاب...</p>
        </div>
    </div>

    <script>
        async function loadAccount() {
            try {
                const res = await fetch('/api/user/account');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('siteBalance').innerText = parseFloat(data.site_balance || 0).toFixed(2);
                }
            } catch (e) {}
        }

        async function loadGames() {
            const grid = document.getElementById('gamesGrid');
            try {
                const res = await fetch('/api/games/list');
                const data = await res.json();
                
                if (!data.games || data.games.length === 0) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">لا توجد ألعاب مضافة حالياً</p>';
                    return;
                }

                grid.innerHTML = '';
                for (const game of data.games) {
                    let title = game.name;
                    let imgUrl = `/games/${game.folder}/cover.png`;

                    try {
                        const infoRes = await fetch(`/games/${game.folder}/info.json`);
                        if (infoRes.ok) {
                            const info = await infoRes.json();
                            if (info.title) title = info.title;
                            if (info.image) imgUrl = `/games/${game.folder}/${info.image}`;
                        }
                    } catch (e) {}

                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <img src="${imgUrl}" class="game-img" onerror="this.src='https://via.placeholder.com/150x120?text=AUREX+GAME'">
                        <div class="game-info">
                            <div class="game-title">${title}</div>
                            <a href="${game.url}" class="btn-play">العب الآن 🎮</a>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            } catch (e) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color:red;">خطأ في تحميل الألعاب</p>';
            }
        }

        loadAccount();
        loadGames();
    </script>
</body>
</html>
