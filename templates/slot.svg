<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d2a"/>
      <stop offset="100%" stop-color="#0a080c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#bf953f"/>
      <stop offset="100%" stop-color="#aa771c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- الخلفية الرئيسية -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="24"/>
  <rect x="12" y="12" width="376" height="376" fill="none" stroke="url(#goldGrad)" stroke-width="3" rx="18" opacity="0.8"/>

  <!-- الإطار الداخلي -->
  <rect x="30" y="30" width="340" height="340" fill="#121620" stroke="#3b2a1a" stroke-width="2" rx="14"/>

  <!-- نافذة الرموز -->
  <g transform="translate(200, 175)" text-anchor="middle">
    <!-- صندوق الرموز -->
    <rect x="-130" y="-65" width="260" height="110" fill="#000" stroke="url(#goldGrad)" stroke-width="2" rx="12" filter="url(#glow)"/>
    <!-- الخطوط الفاصلة -->
    <line x1="-43" y1="-65" x2="-43" y2="45" stroke="#2d3748" stroke-width="2"/>
    <line x1="43" y1="-65" x2="43" y2="45" stroke="#2d3748" stroke-width="2"/>
    <!-- خط الفوز الذهبي -->
    <line x1="-125" y1="-10" x2="125" y2="-10" stroke="#ffd700" stroke-width="2" opacity="0.6"/>
    <!-- الرموز -->
    <text x="-86" y="5" font-size="48" dominant-baseline="middle">7️⃣</text>
    <text x="0" y="5" font-size="48" dominant-baseline="middle">💎</text>
    <text x="86" y="5" font-size="48" dominant-baseline="middle">👑</text>
  </g>

  <!-- النص السفلي -->
  <text x="200" y="315" dominant-baseline="middle" text-anchor="middle" fill="url(#goldGrad)" font-size="26" font-family="system-ui, sans-serif" font-weight="bold" letter-spacing="2">AUREX SLOTS</text>
</svg>
